name: Acceptance

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inngest-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Real-API acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY }}
      INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
      TF_ACC: '1'
    steps:
      - name: Check credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$INNGEST_API_KEY" ] || [ -z "$INNGEST_SIGNING_KEY" ]; then
            echo "::notice::Skipping acceptance tests: INNGEST_API_KEY and INNGEST_SIGNING_KEY repository secrets are required."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.credentials.outputs.available == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.credentials.outputs.available == 'true'
        with:
          terraform_wrapper: false
      - name: Run acceptance tests
        if: steps.credentials.outputs.available == 'true'
        run: go test ./internal/provider/ -run '^TestAcc' -v -count=1 -timeout 30m
